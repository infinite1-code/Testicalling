
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guess the word</title>
  <link rel="stylesheet" href="style.css">
</head>

<body style="position:relative;">

  <header style="
    position:absolute;
    top:0;
    left:0;
    width:100%;
    padding:22px 20px;
    text-align:center;
    font-family:Arial,Helvetica,sans-serif;
    font-size:clamp(1.8rem,6vw,2.4rem);
    font-weight:800;
    letter-spacing:-1px;
  ">
    <span style="color:#3b82f6;">Eco</span><span style="color:#ef4444;">Cash</span>
  </header>

  <main>
    <h1>Guess the word</h1>
    <p>Enter six letters, one per box.</p>

    <div class="tiles" id="tiles">
      <input maxlength="1" autocomplete="off" aria-label="Letter 1">
      <input maxlength="1" autocomplete="off" aria-label="Letter 2">
      <input maxlength="1" autocomplete="off" aria-label="Letter 3">
      <input maxlength="1" autocomplete="off" aria-label="Letter 4">
      <input maxlength="1" autocomplete="off" aria-label="Letter 5">
      <input maxlength="1" autocomplete="off" aria-label="Letter 6">
    </div>

    <button id="submit">Submit</button>
    <div id="msg" role="status"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
