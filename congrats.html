
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Congratulations</title>

  <style>
    :root {
      --bg: #05080f;
      --panel: #0d1422;
      --ink: #f8fafc;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --border: #23334d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.25rem;
      background:
        radial-gradient(ellipse at top, #142747 0%, transparent 55%),
        var(--bg);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
    }

    main {
      position: relative;
      width: 100%;
      max-width: 30rem;
      padding: 2.5rem 2rem;
      text-align: center;
      background: linear-gradient(145deg, #111c30, var(--panel));
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.6),
        0 0 35px rgba(59, 130, 246, 0.08);
      animation: floatIn 0.6s ease-out;
    }

    main::before {
      content: "";
      position: absolute;
      top: -1px;
      left: 20%;
      width: 60%;
      height: 3px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 18px rgba(59, 130, 246, 0.5);
    }

    @keyframes floatIn {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .icon {
      width: 76px;
      height: 76px;
      margin: 0 auto 1.5rem;
      display: grid;
      place-items: center;
      border: 1px solid #315b99;
      border-radius: 50%;
      background: rgba(59, 130, 246, 0.12);
      color: #60a5fa;
      font: 700 2.5rem Arial, sans-serif;
      box-shadow: 0 0 28px rgba(59, 130, 246, 0.12);
    }

    h1 {
      font-size: clamp(1.9rem, 7vw, 2.5rem);
      line-height: 1.2;
      margin: 0 0 1rem;
      letter-spacing: -0.5px;
    }

    p {
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.8;
      margin: 0;
    }

    .approved {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.65rem 1.1rem;
      border: 1px solid #315b99;
      border-radius: 999px;
      background: rgba(59, 130, 246, 0.1);
      color: #93c5fd;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    @media (max-width: 420px) {
      main {
        padding: 2rem 1.25rem;
        border-radius: 18px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      main {
        animation: none;
      }
    }
  </style>

  <script>
    if (!sessionStorage.getItem("won")) {
      location.replace("index.html");
    }
  </script>
</head>

<body>
  <main>
    <div class="icon" aria-hidden="true">✓</div>

    <h1>Congratulations!</h1>

    <p>
      Your loan has been approved.
      Well done!
    </p>

    <div class="approved">Word approved</div>
  </main>
</body>
</html>
